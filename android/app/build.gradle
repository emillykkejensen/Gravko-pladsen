apply plugin: 'com.android.application'

/*
 * Signing.
 *
 * Android identifies an app by its signing key, so a build signed with a different key
 * cannot install over the previous one -- it has to be uninstalled first, which takes the
 * save file with it. That makes the keystore the one thing here worth guarding: the same
 * four secrets have to sign every build for the rest of the app's life.
 *
 * When they are absent (a local build, or a fork without the secrets) the release build
 * falls back to Android's debug key so there is still something installable to look at.
 * CI checks which key was used and refuses to publish a debug-signed APK as a release.
 */
def keystorePath = System.getenv('ANDROID_KEYSTORE_FILE')
def hasKeystore = keystorePath != null && !keystorePath.isEmpty() && file(keystorePath).exists()

android {
    namespace = "dk.werktoej.gravkospil"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dk.werktoej.gravkospil"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI passes the run number, so every build installs over the last one instead of
        // being refused as a downgrade.
        versionCode ((project.findProperty('appVersionCode') ?: '1') as Integer)
        versionName (project.findProperty('appVersionName') ?: '1.0')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
            // The game is already minified by Vite; R8 over the small Java shell saves
            // nothing and Capacitor resolves plugins by reflection, which R8 cannot see.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // MainActivity drives the system bars through WindowCompat directly, so androidx.core
    // has to be a declared dependency rather than one inherited from capacitor-android.
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
